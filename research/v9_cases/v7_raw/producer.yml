name: V9 PR Artifact Build
on:
  pull_request: {}
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview
          path: payload.sh
          archive: false
