name: CI-TRACE External Baseline - zizmor
on:
  pull_request:
permissions:
  contents: read
jobs:
  zizmor-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned zizmor baseline
        run: python -m pip install zizmor==1.30.1
      - name: Audit the exact V7 historical snapshots
        run: |
          python - <<'PY'
          import collections, json, subprocess
          from pathlib import Path
          names = [
              "spire_apply_vuln", "spire_apply_fixed",
              "attest_commit_vuln", "attest_commit_fixed",
          ]
          cases = []
          for name in names:
              file = Path("research_corpus") / (name + ".yml")
              result = subprocess.run(
                  ["zizmor", "--format=json-v1", "--no-exit-codes", str(file)],
                  capture_output=True, text=True, check=True,
              )
              findings = json.loads(result.stdout)
              counts = dict(sorted(collections.Counter(
                  x.get("ident", "unknown") for x in findings).items()
              ))
              cases.append({"case": name, "raw_findings": len(findings), "types": counts})
          print(json.dumps({"tool": "zizmor", "version": "1.30.1",
              "comparison_note": "Finding taxonomies differ; raw counts are not detection accuracy",
              "historical_corpus": cases}, indent=2))
          PY
      - name: Audit same repository workflow corpus
        run: zizmor --collect=workflows --format=json-v1 --no-exit-codes .github/workflows > zizmor-baseline.json
      - name: Print taxonomy counts (no equivalence to CI-TRACE candidates)
        run: |
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          rows = json.loads(Path('zizmor-baseline.json').read_text(encoding='utf-8'))
          names = collections.Counter(x.get('ident', 'unknown') for x in rows)
          print(json.dumps({'tool':'zizmor','version':'1.30.1',
                            'corpus':'current repository .github/workflows',
                            'total_findings':len(rows),
                            'finding_types':dict(sorted(names.items()))}, indent=2))
          PY
