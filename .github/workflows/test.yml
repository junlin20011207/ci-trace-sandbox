name: CI-TRACE unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m benchmarks.compare --assert-results
      - run: python -m benchmarks.v5_delta --assert-results
      - run: python -m benchmarks.v6_delta --assert-results
      - run: python -m ci_trace.scanner_v4 .github/workflows
      - run: python -m ci_trace.scanner_v5 .github/workflows
      - run: python -m ci_trace.scanner_v6 .github/workflows
      - run: python -m benchmarks.public_cases_v7 --assert-results
      - run: python -m ci_trace.scanner_v7 .github/workflows
