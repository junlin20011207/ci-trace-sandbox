name: CI-TRACE V16 read-only external corpus
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-corpus:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install V15 parser and pinned zizmor baseline
        run: |
          python -m pip install -r requirements.txt
          python -m pip install zizmor==1.30.1
          zizmor --version
      - name: Install separately pinned Poutine baseline if binary distribution works
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/poutine-release /tmp/poutine-install
          if gh release download v1.1.6 --repo boostsecurityio/poutine --dir /tmp/poutine-release; then
            python - <<'PY'
          import os, pathlib, tarfile, zipfile, shutil, stat
          root=pathlib.Path('/tmp/poutine-release')
          dest=pathlib.Path('/tmp/poutine-install/poutine')
          possible=[]
          for file in root.iterdir():
              lower=file.name.lower()
              if 'linux' not in lower or not any(x in lower for x in ('amd64','x86_64')):
                  continue
              if tarfile.is_tarfile(file):
                  with tarfile.open(file,'r:*') as archive:
                      for member in archive:
                          if pathlib.PurePosixPath(member.name).name=='poutine' and member.isfile() and member.size<150_000_000:
                              handle=archive.extractfile(member)
                              if handle:dest.write_bytes(handle.read());possible.append(file.name);break
              elif zipfile.is_zipfile(file):
                  with zipfile.ZipFile(file) as archive:
                      for name in archive.namelist():
                          if pathlib.PurePosixPath(name).name=='poutine':
                              dest.write_bytes(archive.read(name));possible.append(file.name);break
              elif lower.endswith(('.deb','.rpm')):continue
              elif file.stat().st_size<150_000_000 and not file.name.endswith(('.txt','.sha256','.json')):
                  dest.write_bytes(file.read_bytes());possible.append(file.name)
          if dest.exists():
              dest.chmod(0o755)
              print('Poutine distribution installed from:',possible)
          else:print('Poutine linux-amd64 artifact unavailable; missing baseline will be recorded')
          PY
          else
            echo "Poutine upstream release unavailable; missing baseline will be recorded"
          fi
          echo /tmp/poutine-install >> "$GITHUB_PATH"
          ls -lh /tmp/poutine-release/ || true
      - name: Evaluate existing V7 scanner and external scanners on frozen GHSL references
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m benchmarks.v16_public_eval --out results/v16_external_result.json
      - name: Try independently sampled GHALogs repository metadata (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m benchmarks.v16_ghalogs
      - name: Preserve machine-readable source SHA, missingness and scanner findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-trace-v16-external-evidence
          path: results/v16_*.json
          if-no-files-found: warn
