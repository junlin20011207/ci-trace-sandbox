name: CI-TRACE V15 Cross-Runner Quorum Experiment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-signer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Sign test subject on security-role runner
        run: python -m benchmarks.v15_multirunner sign --role security_approver --directory endorsements
      - uses: actions/upload-artifact@v4
        with:
          name: security-role-v15
          path: endorsements/security_approver.json
          if-no-files-found: error
  release-signer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Sign test subject on release-role runner
        run: python -m benchmarks.v15_multirunner sign --role release_approver --directory endorsements
      - uses: actions/upload-artifact@v4
        with:
          name: release-role-v15
          path: endorsements/release_approver.json
          if-no-files-found: error
  verify-signed-effects:
    needs: [security-signer, release-signer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: security-role-v15
          path: endorsements
      - uses: actions/download-artifact@v4
        with:
          name: release-role-v15
          path: endorsements
      - name: Assert three distinct runner hostnames and exactly one inert effect
        run: python -m benchmarks.v15_multirunner verify --directory endorsements
