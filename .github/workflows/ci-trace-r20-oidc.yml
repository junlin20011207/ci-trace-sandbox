name: CI-TRACE R21 Identity and Fenced Publish (no deployment)
on:
  push:
    branches:
      - research/ci-trace-r21-fenced-publish-20261012
permissions: {}
jobs:
  oidc-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Verify genuine GitHub OIDC JWT and claims; do not emit token
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q 'cryptography==46.0.4'
          python3 - <<'PY'
          import os,json,time,base64,urllib.request,urllib.parse
          from cryptography.hazmat.primitives.asymmetric.rsa import RSAPublicNumbers
          from cryptography.hazmat.primitives.asymmetric.padding import PKCS1v15
          from cryptography.hazmat.primitives.hashes import SHA256
          def b64(x): return base64.urlsafe_b64decode(x+'='*(-len(x)%4))
          aud='ci-trace-round21-research-only'
          requrl=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in requrl else '?'
          url=requrl+sep+urllib.parse.urlencode({'audience':aud})
          request=urllib.request.Request(url,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=15) as r: token=json.load(r)['value']
          with urllib.request.urlopen('https://token.actions.githubusercontent.com/.well-known/jwks',timeout=15) as r: jwks=json.load(r)['keys']
          segments=token.split('.')
          assert len(segments)==3
          head=json.loads(b64(segments[0])); claims=json.loads(b64(segments[1]))
          assert head.get('alg')=='RS256'
          keys=[k for k in jwks if k.get('kid')==head.get('kid') and k.get('kty')=='RSA']
          assert len(keys)==1
          key=keys[0]
          pub=RSAPublicNumbers(int.from_bytes(b64(key['e']),'big'),int.from_bytes(b64(key['n']),'big')).public_key()
          pub.verify(b64(segments[2]),('.'.join(segments[:2])).encode(),PKCS1v15(),SHA256())
          assert claims.get('iss')=='https://token.actions.githubusercontent.com'
          assert claims.get('aud')==aud
          now=int(time.time())
          assert type(claims.get('iat')) is int and type(claims.get('exp')) is int
          assert claims['iat']-30<=now<claims['exp']
          assert claims.get('repository')==os.environ['GITHUB_REPOSITORY']
          assert str(claims.get('repository_id'))==os.environ['GITHUB_REPOSITORY_ID']
          assert claims.get('ref')==os.environ['GITHUB_REF']
          assert claims.get('sha')==os.environ['GITHUB_SHA']
          assert claims.get('workflow_ref')=='junlin20011207/ci-trace-sandbox/.github/workflows/ci-trace-r20-oidc.yml@refs/heads/research/ci-trace-r21-fenced-publish-20261012'
          print('OIDC_JWKS_SIGNATURE_VERIFIED=yes')
          print('OIDC_ISSUER_AUDIENCE_VERIFIED=yes')
          print('OIDC_REPOSITORY_REF_SHA_BOUND=yes')
          print('OIDC_PROVES_INDEPENDENT_PUBLISHER=no')
          allow=['repository','repository_id','ref','sha','workflow_ref','job_workflow_ref','repository_visibility','runner_environment']
          print('OIDC_PUBLIC_CLAIMS='+json.dumps({x:claims.get(x) for x in allow if x in claims},sort_keys=True))
          PY
      - name: Verify ephemeral signed grants; inspect Gitee read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://raw.githubusercontent.com/junlin20011207/ci-trace-sandbox/${GITHUB_SHA}/research/ci-trace-r20-grant-smoke.py" -o /tmp/ci-trace-r20-grant-smoke.py
          python3 /tmp/ci-trace-r20-grant-smoke.py
          export GIT_TERMINAL_PROMPT=0
          timeout 30 git -c credential.helper= ls-remote https://gitee.com/liljunlin/test.git HEAD | head -n 1
          echo "GITEE_READ_ONLY_AVAILABLE=yes"
          echo "GITEE_PUSH_ATTEMPTED=no"
  fence-protocol-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    steps:
      - name: Run independently invoked Git create-only and online reservation smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://raw.githubusercontent.com/junlin20011207/ci-trace-sandbox/${GITHUB_SHA}/research/ci-trace-r21-guardrail-smoke.sh" -o /tmp/ci-trace-r21-guardrails.sh
          bash /tmp/ci-trace-r21-guardrails.sh
          echo "NO_GITEE_CREDENTIAL_USED=yes"
          echo "REAL_GITEE_WRITE=no"
  git-tree-and-symlink-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    steps:
      - name: Reproduce unauthorized extra-tree file and block symlink writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,tempfile
          from pathlib import Path
          def git(*args,cwd=None):
              return subprocess.check_output(['git',*args],cwd=cwd,stderr=subprocess.DEVNULL,text=True).strip()
          with tempfile.TemporaryDirectory() as temp:
              root=Path(temp); bare=root/'remote.git';work=root/'work'
              git('init','--bare',str(bare))
              git('clone',str(bare),str(work))
              git('-C',str(work),'config','user.name','R21 Lab')
              git('-C',str(work),'config','user.email','r21lab@example.invalid')
              (work/'README.md').write_text('base')
              git('-C',str(work),'add','.')
              git('-C',str(work),'commit','-m','base')
              git('-C',str(work),'push','origin','HEAD:master')
              (work/'research').mkdir()
              (work/'research'/'payload.txt').write_text('approved')
              (work/'unauthorized.txt').write_text('UNAPPROVED')
              git('-C',str(work),'add','.')
              git('-C',str(work),'commit','-m','CI-TRACE-R21 operation=op1234567')
              commit=git('-C',str(work),'rev-parse','HEAD')
              delta=git('--git-dir',str(bare),'diff-tree','--no-commit-id','--name-only','-r',commit).splitlines()
              assert sorted(delta)==['research/payload.txt','unauthorized.txt']
              assert delta!=['research/payload.txt']
              print('UNAPPROVED_EXTRA_TREE_CHANGE_DETECTED=yes')
              victim=root/'victim';victim.mkdir()
              parent=root/'candidate';parent.mkdir()
              (parent/'research').symlink_to(victim,target_is_directory=True)
              try:
                  os.open(parent/'research',os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                  raise AssertionError('symbolic link was followed')
              except OSError:
                  pass
              assert not (victim/'payload.txt').exists()
              print('SYMLINK_DIRECTORY_NOFOLLOW_BLOCKED=yes')
              try:
                  b'\\xff\\xfe'.decode('utf-8')
                  raise AssertionError('binary accepted as UTF-8')
              except UnicodeDecodeError:
                  print('INVALID_UTF8_REJECTED_BEFORE_PUBLISH=yes')
          PY
          echo "GITEE_PUSH_ATTEMPTED=no"
  secretless-release-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ensure no release is possible without independent grant and publisher
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITEE_TOKEN:-}"
          test -z "${AUTHORITY_PRIVATE_KEY:-}"
          echo "NO_INDEPENDENT_GRANT=HOLD"
          echo "NO_RELEASE_CREDENTIAL=HOLD"
          echo "GITEE_PUSH_ATTEMPTED=no"
