name: CI-TRACE V8 authenticated artifact gate probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  actual-github-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install V9 signed approval verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve authenticated historical run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: '38138006392'
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" > run-api.json
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts" > artifact-list.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run = json.loads(Path('run-api.json').read_text())
          items = json.loads(Path('artifact-list.json').read_text())['artifacts']
          found = [item for item in items if item['name'] == 'ci-trace-layout']
          assert len(found) == 1, 'expected exactly one archived artifact'
          artifact = found[0]
          event = {'repository': {'full_name': run['repository']['full_name']},
                   'workflow_run': {
                       'id': run['id'], 'event': run['event'],
                       'head_sha': run['head_sha'],
                       'head_branch': run['head_branch'],
                       'head_repository': run.get('head_repository') or {},
                       'conclusion': run['conclusion']}}
          policy = {'expected_run_id': run['id'],
                    'repository': run['repository']['full_name'],
                    'artifact_name': 'ci-trace-layout',
                    'allowed_events': ['pull_request'],
                    'require_same_repo': False,
                    'allow_extensions': ['.txt'],
                    'max_entries': 10,
                    'max_uncompressed_bytes': 10240}
          Path('event-api.json').write_text(json.dumps(event))
          Path('artifact-api.json').write_text(json.dumps(artifact))
          Path('policy.json').write_text(json.dumps(policy))
          with open(os.environ['GITHUB_ENV'], 'a') as fd:
              fd.write('SOURCE_ARTIFACT_ID='+str(artifact['id'])+'\n')
          PY
      - name: Download the real historical GitHub artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > artifact.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          actual='sha256:'+hashlib.sha256(Path('artifact.zip').read_bytes()).hexdigest()
          reported=json.loads(Path('artifact-api.json').read_text())['digest']
          print(json.dumps({'hash_matches_github_api':actual==reported,
                            'archive_bytes':Path('artifact.zip').stat().st_size}))
          PY
      - name: Verify and isolate using real source metadata
        env:
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$TEMP/ci-trace-release"
          python -m ci_trace.provenance_guard \
            --archive artifact.zip --event event-api.json \
            --artifact-api artifact-api.json --policy policy.json \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > result.json
          python - <<'PY'
          import json
          from pathlib import Path
          approved=json.loads(Path('result.json').read_text())
          assert approved['status']=='approved', approved
          assert (Path(approved['release_dir'])/'probe.txt').read_text() == 'ci-trace layout probe\n'
          print(json.dumps({'integration':'real-github-artifact',
                            'decision':approved['status'],
                            'source_run':approved['run_id'],
                            'source_artifact':approved['artifact_id'],
                            'isolated':True}))
          PY
      - name: Confirm the same artifact is rejected with a wrong run identity
        env:
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('policy.json').read_text())
          policy['expected_run_id']=99999999
          Path('negative-policy.json').write_text(json.dumps(policy))
          PY
          if python -m ci_trace.provenance_guard \
              --archive artifact.zip --event event-api.json \
              --artifact-api artifact-api.json --policy negative-policy.json \
              --output-root "$TEMP/ci-trace-release" \
              --workspace "$WORKSPACE" > negative.json; then
            echo "ERROR: incorrect source was approved"
            exit 1
          fi
          grep -q run_id_not_expected negative.json

      - name: Verify using direct authenticated GitHub API source (no caller JSON)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m ci_trace.github_api_gate \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --archive artifact.zip --policy policy.json \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > direct-api-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('direct-api-result.json').read_text())
          assert result['status'] == 'approved'
          assert Path(result['release_dir'], 'probe.txt').read_text() == 'ci-trace layout probe\n'
          print(json.dumps({'direct_authenticated_api': True,
                            'source_run': result['run_id'],
                            'source_artifact': result['artifact_id'],
                            'approved': result['status']}))
          PY
      - name: V9 authorizer binds real archive to an independently pinned SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Source SHA was pinned from a separate GitHub artifact record ahead of test.
          # This test workflow is a PR and NOT a protected production approval record.
          python -m ci_trace.github_authorized_gate \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --approved-sha "b6d81e195455f1681365b0cb5ce8e05803c638fb" \
            --archive artifact.zip --policy policy.json \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > v9-approved.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('v9-approved.json').read_text())
          assert value['status']=='approved'
          assert value['authorization_status']=='exact_revision_bound'
          assert value['approval_binding']['authorized_commit_sha']=='b6d81e195455f1681365b0cb5ce8e05803c638fb'
          assert value['safe_to_execute_or_publish'] is False
          print(json.dumps({'v9_real_api_exact_sha':'approved','source_run':value['run_id']}))
          PY
      - name: V9 rejects the same real archive if approved SHA does not match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if python -m ci_trace.github_authorized_gate \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --approved-sha "0000000000000000000000000000000000000000" \
            --archive artifact.zip --policy policy.json \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > v9-rejected.json; then
            echo "Unexpected approval of unauthorized SHA" >&2
            exit 1
          fi
          grep -q approved_commit_changed v9-rejected.json
          echo '{"v9_real_api_wrong_sha":"denied"}'
      - name: V9 cryptographic approval integration using real GitHub API and benign ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_ARTIFACT_ID: ${{ env.SOURCE_ARTIFACT_ID }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from ci_trace.github_api_gate import load_authenticated_metadata
          from ci_trace.signed_authorization import payload_bytes,verify_signed_release
          from ci_trace.provenance_guard import Denied
          run_id=38138006392
          event,artifact=load_authenticated_metadata(os.environ['REPO'],run_id,
                                  int(os.environ['SOURCE_ARTIFACT_ID']),os.environ['GH_TOKEN'])
          policy=json.loads(Path('policy.json').read_text())
          pinned_sha='b6d81e195455f1681365b0cb5ce8e05803c638fb'
          now=datetime.now(timezone.utc)
          record={'repository':os.environ['REPO'],'run_id':run_id,
                  'artifact_name':'ci-trace-layout','commit_sha':pinned_sha,
                  'purpose':'artifact_release',
                  'issued_at':(now-timedelta(minutes=1)).isoformat(),
                  'expires_at':(now+timedelta(minutes=10)).isoformat()}
          # Ephemeral signing key is used ONLY for CI integration testing.
          # Production signers must reside outside PR-controlled workflows.
          signer=Ed25519PrivateKey.generate()
          key_hex=signer.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw).hex()
          keys={'test-ci-key':key_hex}
          pack={'key_id':'test-ci-key','record':record,
                'signature':base64.b64encode(signer.sign(payload_bytes(record))).decode()}
          output=Path(os.environ['TEMP'])/'ci-trace-release'
          approved=verify_signed_release('artifact.zip',event,artifact,policy,pack,
                         keys,output,os.environ['WORKSPACE'],now=now)
          assert approved['status']=='approved'
          assert approved['approval_signature']['verified'] is True
          pack['record']['commit_sha']='0'*40
          try:
              verify_signed_release('artifact.zip',event,artifact,policy,pack,
                                     keys,output,os.environ['WORKSPACE'],now=now)
              raise AssertionError('Tampered signature unexpectedly accepted')
          except Denied as error:
              assert str(error)=='approval_signature_invalid',str(error)
          print(json.dumps({'real_authenticated_artifact':True,
                            'test_only_signed_approval':'pass',
                            'tampered_approval':'denied'}))
          PY
      - name: V9 end-to-end signed CLI with trusted-root path separation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$TEMP/ci-trace-keys"
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from ci_trace.signed_authorization import payload_bytes
          now=datetime.now(timezone.utc)
          record={'repository':os.environ['REPO'],'run_id':38138006392,
              'artifact_name':'ci-trace-layout',
              'commit_sha':'b6d81e195455f1681365b0cb5ce8e05803c638fb',
              'purpose':'artifact_release',
              'issued_at':(now-timedelta(minutes=1)).isoformat(),
              'expires_at':(now+timedelta(minutes=10)).isoformat()}
          sk=Ed25519PrivateKey.generate()
          pub=sk.public_key().public_bytes(encoding=serialization.Encoding.Raw,
                                     format=serialization.PublicFormat.Raw).hex()
          package={'key_id':'ephemeral-test-key','record':record,
              'signature':base64.b64encode(sk.sign(payload_bytes(record))).decode()}
          protected=Path(os.environ['TEMP'])/'ci-trace-keys'
          (protected/'keys.json').write_text(json.dumps({'ephemeral-test-key':pub}))
          (protected/'policy.json').write_text(Path('policy.json').read_text())
          Path('approval-package.json').write_text(json.dumps(package))
          package['record']['commit_sha']='0'*40
          Path('tampered-approval.json').write_text(json.dumps(package))
          PY
          python -m ci_trace.github_signed_gate \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --archive artifact.zip --approval-package approval-package.json \
            --trusted-keys "$TEMP/ci-trace-keys/keys.json" \
            --trusted-policy "$TEMP/ci-trace-keys/policy.json" \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > signed-cli-approved.json
          if python -m ci_trace.github_signed_gate \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --archive artifact.zip --approval-package tampered-approval.json \
            --trusted-keys "$TEMP/ci-trace-keys/keys.json" \
            --trusted-policy "$TEMP/ci-trace-keys/policy.json" \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > signed-cli-rejected.json; then
            echo "Tampered signature was accepted" >&2
            exit 1
          fi
          grep -q approval_signature_invalid signed-cli-rejected.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('signed-cli-approved.json').read_text())
          assert r['status']=='approved'
          assert r['approval_signature']['verified']
          assert not r['safe_to_execute_or_publish']
          print(json.dumps({'signed_cli_real_github_api':'approved',
                            'tampered_record':'denied',
                            'protected_root_outside_workspace':True}))
          PY
      - name: V10 real signed snapshot and sink-bound byte consumer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m ci_trace.github_signed_gate_v10 \
            --repository "$REPO" --run-id 38138006392 \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --archive artifact.zip --approval-package approval-package.json \
            --trusted-keys "$TEMP/ci-trace-keys/keys.json" \
            --trusted-policy "$TEMP/ci-trace-keys/policy.json" \
            --output-root "$TEMP/ci-trace-release" \
            --workspace "$WORKSPACE" > v10-real-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          from ci_trace.verified_reader_v10 import read_verified_member
          from ci_trace.provenance_guard import Denied
          report=json.loads(Path('v10-real-release.json').read_text())
          assert report['status']=='approved'
          assert report['approval_signature']['verified'] is True
          assert report['snapshot_type']=='immutable_bytes'
          assert not report['safe_to_execute_or_publish']
          assert read_verified_member(report,'probe.txt') == b'ci-trace layout probe\n'
          filepath=Path(report['release_dir'])/'probe.txt'
          filepath.write_bytes(b'xx-trace layout probe\n')
          try:
              read_verified_member(report,'probe.txt')
              raise AssertionError('Postrelease mutation bypassed trusted manifest')
          except Denied as exc:
              assert str(exc)=='member_content_changed',str(exc)
          print(json.dumps({'v10_real_github_artifact':True,
              'snapshot_and_signature_verified':True,
              'same_size_postrelease_modification':'denied'}))
          PY
